name: Check data and build report

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "analysis/**"
      - "tools/**"
      - "report/template.md"
      - "requirements.txt"
      - ".github/workflows/build-report.yml"
  pull_request:
  workflow_dispatch:

# One build at a time, so two uploads close together don't race to push the report
concurrency:
  group: build-report-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check data is safe to publish
        run: python tools/ingest.py check

      - name: Build report
        run: python tools/build_report.py --out report

      - name: Commit report
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add report/REPORT.md report/figures report/results
          if git diff --cached --quiet; then
            echo "Report unchanged."
            exit 0
          fi
          git commit -m "Rebuild report from ${GITHUB_SHA::7}"
          git pull --rebase origin main
          git push origin HEAD:main
